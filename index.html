<!doctype html>
<html lang="en">
  <head>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/logo/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/logo/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/logo/favicon-16x16.png"
    />
    <link rel="icon" href="./assets/logo/favicon.ico" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Forge - Prompt Engine</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🐲 Monster Forge</h1>
      <div class="subtitle">AI Prompt Engine</div>

      <div class="grid">
        <div class="card">
          <div class="form-group">
            <label>Species</label>
            <select id="species"></select>
          </div>

          <div class="form-group">
            <label>Element</label>
            <select id="element">
              <option>Fire</option>
              <option>Water</option>
              <option>Earth</option>
              <option>Wind</option>
              <option>Ice</option>
              <option>Thunder</option>
            </select>
          </div>

          <div class="form-group">
            <label>Rarity</label>
            <select id="rarity">
              <option>Common</option>
              <option>Rare</option>
              <option>Epic</option>
              <option>Legendary</option>
            </select>
          </div>

          <div class="form-group">
            <label>Pose</label>
            <select id="pose">
              <option>Standing</option>
              <option>Walking</option>
              <option>Attacking</option>
            </select>
          </div>

          <div class="form-group">
            <label>Background</label>
            <select id="background">
              <option>Transparent</option>
              <option>White</option>
              <option>Forest</option>
              <option>Dungeon</option>
              <option>Volcano</option>
            </select>
          </div>

          <button id="btnGenerate" class="primary">🎲 Generate</button>

          <button id="btnRandom" class="secondary">🎲 Random</button>

          <button id="btnCopyPrompt" class="success">📋 Copy Prompt</button>
        </div>

        <div class="card">
          <h3>Monster JSON</h3>

          <div id="monsterName" class="monster-name">⚡ Generate a monster</div>

          <pre id="json"></pre>

          <h3 style="margin-top: 20px">Prompt</h3>

          <textarea id="prompt"></textarea>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
